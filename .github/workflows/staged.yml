name: Validate Pillow decoder-only PR
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated target names, or all
        default: all
      variants:
        description: JSON list of variants
        default: '["pr"]'
      dependency_run:
        description: Optional prior run ID with successful dependency artifacts for selected platforms
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          SELECTED: ${{ inputs.targets }}
        run: python scripts/plan.py >> "$GITHUB_OUTPUT"
  platform:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/platform.yml
    with:
      target: ${{ toJSON(matrix) }}
      variants: ${{ inputs.variants }}
      dependency_run: ${{ fromJSON('{"linux-x86_64":"38309406995","linux-aarch64":"38308512861","macos-x86_64":"38306998901","macos-arm64":"38304925834","windows-amd64":"38306989036"}')[matrix.name] }}
