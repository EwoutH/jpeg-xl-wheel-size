name: Report saved wheel measurements
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Comma-separated run IDs with wheel and test artifacts
        required: true
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: olokelo/Pillow
          ref: d00ba3a89faabd31fd92c3b506c86557da8c0a0b
          path: Pillow
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Fetch saved artifacts (no builds)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT_RUNS: ${{ inputs.runs }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          for value in os.environ['EXPERIMENT_RUNS'].split(','):
              run_id = str(int(value.strip()))
              subprocess.run(['gh', 'run', 'download', run_id, '--repo', os.environ['GITHUB_REPOSITORY'], '--pattern', 'wheel-*', '--pattern', 'tests-*', '--dir', 'artifacts/run-' + run_id], check=True)
              metadata = subprocess.check_output(['gh', 'run', 'view', run_id, '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'databaseId,headSha,createdAt,updatedAt,status,conclusion,url,jobs,workflowName'])
              Path('artifacts/run-' + run_id + '/run.json').write_bytes(metadata)
          PY
      - name: Reuse upstream size-comparison tool
        run: |
          python -m pip install humanize prettytable termcolor
          python scripts/compare_upstream.py artifacts
          python scripts/analyze.py artifacts --repack
          cat RESULTS.md UPSTREAM-COMPARISON.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve small raw measurements
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for name in ('sizes.json', 'verification.json', 'tests.xml', 'variant.patch', 'run.json'):
              for path in Path('artifacts').rglob(name):
                  dest = Path('measurements') / path.relative_to('artifacts')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, dest)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurement-reports
          path: |
            RESULTS.md
            UPSTREAM-COMPARISON.md
            pypi-baseline.json
            measurements/
