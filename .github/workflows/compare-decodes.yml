name: Compare decoding from saved wheels
on:
  workflow_dispatch:
    inputs:
      run:
        description: Build run containing the five JPEG XL wheel artifacts
        required: true
      target:
        description: Platform name
        required: true
      runner:
        description: Matching GitHub runner label
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: olokelo/Pillow
          ref: d00ba3a89faabd31fd92c3b506c86557da8c0a0b
          path: Pillow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ inputs.target }}-*
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
          path: saved
      - run: python -m pip install numpy
      - run: python scripts/compare_decodes.py saved Pillow/Tests/images/jxl
      - name: Publish summary
        shell: bash
        run: cat controlled-results/COMPARISON.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-${{ inputs.target }}
          path: |
            controlled-results/COMPARISON.md
            controlled-results/comparison.json
            controlled-results/*/samples.json
          retention-days: 30
